<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Femto Physics — Theoretical Physics & Scientific Computing</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Official documentation, equations, and simulation archives for Femto Physics YouTube channel.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="img/logo.png">
  <!-- Theme: Dark Slate / Obsidian -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  <style>
    :root {
      --theme-color: #00e5ff;
      --text-color-base: #e2e8f0;
      --background: #0a0e17;
      --sidebar-background: #0d131f;
    }
    body {
      background-color: #0a0e17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .sidebar {
      background-color: #0d131f;
      border-right: 1px solid #1e293b;
    }
    .sidebar-nav a {
      color: #94a3b8;
    }
    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      color: #00e5ff;
      font-weight: bold;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #00e5ff;
    }
    .markdown-section a {
      color: #ffd54f;
      font-weight: 600;
      text-decoration: underline;
    }
    .markdown-section blockquote {
      border-left: 4px solid #00e5ff;
      background: #0f172a;
      padding: 12px 18px;
    }
    .markdown-section pre {
      background: #0d131f !important;
      border: 1px solid #1e293b;
    }
    .yt-card {
      display: inline-block;
      padding: 12px 24px;
      background: #ff0000;
      color: #ffffff !important;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none !important;
      margin: 15px 0;
      box-shadow: 0 4px 14px rgba(255, 0, 0, 0.4);
    }
    .yt-card:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>
  <div id="app">Loading Femto Physics Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Femto Physics',
      repo: 'https://github.com/TheFemtoPhysics/Femto-Physics',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search physics topics, equations, cross-sections...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy Code',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Math rendering -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
