<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Femto Physics — Theoretical Physics & Scientific Computing</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Official documentation, equations, and simulation archives for Femto Physics YouTube channel.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="img/logo.png">
  
  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" id="docsify-theme-link">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
  <style>
    /* =========================================================
       FEMTO PHYSICS DUAL PALETTE: BLUISH DARK & SOOTHING OFF-WHITE
       ========================================================= */

    /* 1. BLUISH DARK THEME (DEFAULT) */
    :root, body.theme-dark {
      --theme-color: #00e5ff;
      --heading-color: #00e5ff;    /* Cherenkov cyan glow */
      --bg-main: #0a0f1d;          /* Deep rich navy-slate, not pitch black */
      --bg-sidebar: #0f172a;       /* Deep slate sidebar */
      --bg-card: #131c31;          /* Card container */
      --bg-card-alt: #0d1527;      /* Alternate row background */
      --text-main: #f1f5f9;        /* Crisp off-white */
      --text-muted: #94a3b8;       /* Slate muted text */
      --border-color: #1e293b;     /* Border lines */
      --th-bg: #0c1424;            /* Table header */
      --th-text: #00e5ff;          /* Cherenkov cyan */
      --link-watch: #facc15;       /* Bright golden amber */
      --link-watch-bg: rgba(250, 204, 21, 0.12);
      --link-watch-border: rgba(250, 204, 21, 0.35);
      --link-notes: #38bdf8;       /* Cyan link */
      --quote-bg: #0f1b33;
      --quote-border: #00e5ff;
    }

    /* 2. SOOTHING WARM HONEY OFF-WHITE LIGHT THEME */
    body.theme-light {
      --theme-color: #d97706;      /* Warm golden amber */
      --heading-color: #92400e;    /* Rich, sweet honey-amber for crystal-clear readability */
      --bg-main: #faf8f5;          /* Sweet, warm soothing cream/yellowish off-white */
      --bg-sidebar: #f5f0e6;       /* Warm ivory/parchment sidebar */
      --bg-card: #ffffff;          /* Pure white card */
      --bg-card-alt: #f8f4ec;      /* Warm alternate row */
      --text-main: #292524;        /* Soft charcoal-stone typography */
      --text-muted: #78716c;       /* Warm stone-500 muted text */
      --border-color: #e2d9cc;     /* Warm subtle border */
      --th-bg: #efe7d8;            /* Warm parchment table header */
      --th-text: #78350f;          /* Deep warm bronze table header text */
      --link-watch: #b45309;       /* Deep warm amber */
      --link-watch-bg: rgba(217, 119, 6, 0.12);
      --link-watch-border: rgba(217, 119, 6, 0.4);
      --link-notes: #b45309;       /* Honey-amber link */
      --quote-bg: #fef3c7;         /* Soft warm amber highlight */
      --quote-border: #f59e0b;     /* Honey gold border */
    }

    /* GLOBAL RESETS & TYPOGRAPHY */
    body {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .content, main {
      background-color: var(--bg-main) !important;
    }

    /* SIDEBAR */
    .sidebar {
      background-color: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border-color) !important;
      transition: background-color 0.25s ease;
    }
    .sidebar-nav a {
      color: var(--text-muted) !important;
      font-size: 0.95rem;
    }
    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      color: var(--theme-color) !important;
      font-weight: 700;
    }

    /* HEADINGS */
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: var(--heading-color) !important;
      font-weight: 700;
      transition: color 0.25s ease;
    }

    /* BLOCKQUOTES & CODE */
    .markdown-section blockquote {
      border-left: 4px solid var(--quote-border) !important;
      background: var(--quote-bg) !important;
      color: var(--text-main) !important;
      padding: 14px 20px !important;
      border-radius: 6px;
      margin: 20px 0;
    }
    .markdown-section pre {
      background: var(--bg-sidebar) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 8px;
    }

    /* =========================================================
       HIGH-CONTRAST PROFESSIONAL TABLE OVERRIDES (NO MORE UNREADABLE ROWS)
       ========================================================= */
    .markdown-section table {
      border-collapse: separate !important;
      border-spacing: 0 !important;
      width: 100% !important;
      margin: 25px 0 !important;
      border-radius: 10px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important;
      border: 1px solid var(--border-color) !important;
      background-color: var(--bg-card) !important;
      display: table !important;
    }

    /* TABLE HEADERS */
    .markdown-section table th {
      background-color: var(--th-bg) !important;
      color: var(--th-text) !important;
      font-weight: 800 !important;
      padding: 14px 18px !important;
      text-transform: uppercase !important;
      font-size: 0.85rem !important;
      letter-spacing: 0.05em !important;
      border: none !important;
      border-bottom: 2px solid var(--theme-color) !important;
      text-align: left !important;
    }

    /* TABLE ROWS (ALTERNATING HIGH CONTRAST) */
    .markdown-section table tr {
      background-color: var(--bg-card) !important;
      border-bottom: 1px solid var(--border-color) !important;
      transition: background-color 0.15s ease;
    }

    .markdown-section table tr:nth-child(even),
    .markdown-section table tr:nth-child(2n) {
      background-color: var(--bg-card-alt) !important;
    }

    .markdown-section table tr:hover {
      background-color: rgba(0, 229, 255, 0.08) !important;
    }

    /* TABLE CELLS */
    .markdown-section table td {
      padding: 14px 18px !important;
      color: var(--text-main) !important;
      font-size: 0.95rem !important;
      border: none !important;
      border-bottom: 1px solid var(--border-color) !important;
      vertical-align: middle !important;
    }

    /* WATCH LINKS (VIBRANT YELLOW GLOW) */
    .markdown-section table td a[href*="youtu"],
    .markdown-section table td a[href*="youtube.com"] {
      color: var(--link-watch) !important;
      font-weight: 700 !important;
      text-decoration: none !important;
      padding: 4px 10px !important;
      border-radius: 5px !important;
      background: var(--link-watch-bg) !important;
      border: 1px solid var(--link-watch-border) !important;
      display: inline-block !important;
      white-space: nowrap !important;
      transition: all 0.2s ease !important;
    }

    .markdown-section table td a[href*="youtu"]:hover,
    .markdown-section table td a[href*="youtube.com"]:hover {
      background: rgba(250, 204, 21, 0.28) !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(250, 204, 21, 0.3) !important;
    }

    /* DOCUMENTATION NOTES LINKS */
    .markdown-section table td a:not([href*="youtu"]):not([href*="youtube.com"]) {
      color: var(--link-notes) !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      padding: 4px 8px !important;
      border-radius: 4px !important;
      transition: all 0.2s ease !important;
    }

    .markdown-section table td a:not([href*="youtu"]):not([href*="youtube.com"]):hover {
      text-decoration: underline !important;
      color: var(--theme-color) !important;
    }

    /* =========================================================
       MINIMALIST AESTHETIC THEME TOGGLE BUTTON
       ========================================================= */
    #theme-toggle-btn {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      outline: none;
    }

    #theme-toggle-btn:hover {
      border-color: var(--theme-color);
      transform: scale(1.1) rotate(12deg);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    /* YOUTUBE EMBED CARDS */
    .yt-card {
      display: inline-block;
      padding: 12px 24px;
      background: #dc2626;
      color: #ffffff !important;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none !important;
      margin: 15px 0;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
    }
    .yt-card:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body class="theme-dark">
  <!-- Floating Theme Switcher (Aesthetic Sun/Moon Icon) -->
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
    <span id="theme-icon">🌙</span>
  </button>

  <div id="app">Loading Femto Physics Documentation...</div>

  <script>
    // Theme Switcher Logic
    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.remove('theme-dark');
        document.body.classList.add('theme-light');
        document.getElementById('theme-icon').textContent = '☀️';
        localStorage.setItem('femto_theme', 'light');
      } else {
        document.body.classList.remove('theme-light');
        document.body.classList.add('theme-dark');
        document.getElementById('theme-icon').textContent = '🌙';
        localStorage.setItem('femto_theme', 'dark');
      }
    }

    function toggleTheme() {
      const current = localStorage.getItem('femto_theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // Initialize Theme
    const savedTheme = localStorage.getItem('femto_theme') || 'dark';
    applyTheme(savedTheme);

    // Docsify Configuration
    window.$docsify = {
      name: 'Femto Physics',
      repo: 'https://github.com/TheFemtoPhysics/Femto-Physics',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search physics topics, equations, cross-sections...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy Code',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Math rendering -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
